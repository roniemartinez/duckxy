services:
  duckxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: duckxy:dev
    container_name: duckxy
    restart: unless-stopped
    environment:
      DUCKXY_BIND: 0.0.0.0:5757
      RUST_LOG: duckxy=debug,tower_http=debug,info
    ports:
      - "5757:5757"
    volumes:
      - ./src:/app/src
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - ./favicon.ico:/app/favicon.ico
      - duckxy-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5757/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  duckxy-target:
    name: duckxy_target
  cargo-registry:
    name: duckxy_cargo-registry
